buildscript {
    repositories {
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0'

group = 'com.example.playerlocatorhud'

archivesBaseName = 'playerlocatorhud'

minecraft {
    version = '1.12.2-14.23.5.2859'
    runDir = 'run'

    mappings channel: 'snapshot', version: '20210309-1.12.2'
}

repositories {
    mavenCentral()
    jcenter()
    maven {
        name = 'forge'
        url = 'https://files.minecraftforge.net/maven'
    }
}

dependencies {
    deobfCompile "net.minecraft:launchwrapper:1.12"
    deobfCompile "org.ow2.asm:asm-all:5.2"
    deobfCompile "org.ow2.asm:asm-tree:5.2"
    deobfCompile "org.ow2.asm:asm-commons:5.2"
    deobfCompile "org.ow2.asm:asm-analysis:5.2"
    deobfCompile "org.ow2.asm:asm-util:5.2"
    deobfCompile "org.ow2.asm:asm-debug-all:5.2"
}